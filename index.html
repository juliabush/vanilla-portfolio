<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>juliabush.dev</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="face-container">
      <div
        class="face-tracker"
        id="face"
        data-base-path="./face_lookup/faces/"
        data-debug="false"
      ></div>
    </div>

    <div class="intro">
      <div class="face-label">Hi, I'm Julia Bush</div>
      <div class="face-description">
        Full-Stack Developer, check out my projects. Would love to get in touch!
      </div>
    </div>
    <div class="social-row">
      <div class="social-item">
        <a href="assets/resume.pdf" target="_blank">
          <img src="assets/resume-icon.png" alt="Resume" />
        </a>
        <span>Resume</span>
      </div>

      <div class="social-item">
        <a href="https://github.com/juliabush" target="_blank">
          <img src="assets/github.png" alt="GitHub" />
        </a>
        <span>GitHub</span>
      </div>

      <div class="social-item">
        <a href="https://linkedin.com/in/julia-bush-7711b7311/" target="_blank">
          <img src="assets/linkedin.avif" alt="LinkedIn" />
        </a>
        <span>LinkedIn</span>
      </div>
    </div>
    <div class="project-bubble-wrapper" onclick="openModal()">
      <div class="projects-area">
        <div
          class="project-bubble one"
          data-x-desktop="76%"
          data-y-desktop="48%"
          data-x-mobile="18%"
          data-y-mobile="88%"
          style="--size: 260px"
        >
          <svg viewBox="0 0 100 100" class="bubble-label">
            <defs>
              <path id="bubbleArc" d="M 10,50 A 40,40 0 0 1 90,50" />
            </defs>
            <text>
              <textPath
                href="#bubbleArc"
                startOffset="30%"
                text-anchor="middle"
              >
                Blog Aggregator
              </textPath>
            </text>
          </svg>
        </div>
      </div>
      <!-- Start of Tarot Project Bubble -->
      <div class="project-bubble-wrapper" onclick="openModal()">
        <div
          class="project-bubble two"
          data-x-desktop="88%"
          data-y-desktop="78%"
          data-x-mobile="74%"
          data-y-mobile="18%"
          style="--size: 420px"
        >
          <iframe
            src="https://tarot-finale.vercel.app/"
            frameborder="0"
            class="frame"
          ></iframe>
          <svg viewBox="0 0 100 100" class="bubble-label">
            <defs>
              <path id="bubbleArc" d="M 10,50 A 40,40 0 0 1 90,50" />
            </defs>
            <text>
              <textPath
                href="#bubbleArc"
                startOffset="67%"
                text-anchor="middle"
              >
                Tarot AI App
              </textPath>
            </text>
          </svg>
        </div>
      </div>
      <!-- Tarot modal -->
      <div id="modal" class="modal">
        <div class="modal-content">
          <span class="close" onclick="closeModal()">&times;</span>
          <h2>Tarot AI App</h2>
          <p>Your modal content here.</p>
        </div>
      </div>
      <!--Start of 3D Food Market Bubble-->
      <div
        class="project-bubble three"
        data-x-desktop="88%"
        data-y-desktop="23%"
        data-x-mobile="20%"
        data-y-mobile="16%"
        style="--size: 320px"
      >
        <iframe
          src="https://pokedex-q6xy.vercel.app/"
          frameborder="0"
          class="frame"
        ></iframe>
        <svg viewBox="0 0 100 100" class="bubble-label">
          <defs>
            <path id="bubbleArc" d="M 10,50 A 40,40 0 0 1 90,50" />
          </defs>
          <text>
            <textPath href="#bubbleArc" startOffset="50%" text-anchor="middle">
              Pokedex
            </textPath>
          </text>
        </svg>
      </div>
      <div
        class="project-bubble four"
        data-x-desktop="7%"
        data-y-desktop="58%"
        data-x-mobile="82%"
        data-y-mobile="92%"
        style="--size: 260px"
      >
        <img src="./project-gifs/asteroids.gif" alt="" class="bubble-gif" />
        <svg viewBox="0 0 100 100" class="bubble-label">
          <defs>
            <path id="bubbleArc" d="M 10,50 A 40,40 0 0 1 90,50" />
          </defs>
          <text>
            <textPath href="#bubbleArc" startOffset="77%" text-anchor="middle">
              Asteroids.py
            </textPath>
          </text>
        </svg>
      </div>
    </div>
    <div
        class="project-bubble five"
        data-x-desktop="12%"
        data-y-desktop="23%"
        data-x-mobile="49%"
        data-y-mobile="96%"
        style="--size: 340px"
      >
        <img src="./project-gifs/asteroids.gif" alt="" class="bubble-gif" />
        <svg viewBox="0 0 100 100" class="bubble-label">
          <defs>
            <path id="bubbleArc" d="M 10,50 A 40,40 0 0 1 90,50" />
          </defs>
          <text>
            <textPath href="#bubbleArc" startOffset="47%" text-anchor="middle">
              static_site_generator.py
            </textPath>
          </text>
        </svg>
      </div>
    </div>
    <script src="main.js" defer></script>
    <script src="./face_lookup/face-tracker.js" defer></script>
  </body>
</html>
